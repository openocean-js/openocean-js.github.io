<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Water</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas; chrome floats in the four corners like instrument readouts on a chart table. */
:root {
  color-scheme: dark;
  --ink: #e9f1f2;
  --ink-dim: #9fb4b8;
  --glass: rgba(8, 22, 28, 0.62);
  --glass-line: rgba(190, 228, 232, 0.16);
  --signal: #f2b43c;
  --pressed: #d9eef0;
  --font-ui: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "DM Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; margin: 0; background: #07161c; color: var(--ink); overflow: hidden; }
body { font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.chip { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

#brand {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px 9px; border-radius: 4px;
  display: grid; gap: 2px; pointer-events: none;
}
#brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
#brand p { margin: 0; font: 400 11px/1.3 var(--font-data); color: var(--ink-dim); letter-spacing: 0.02em; }

#gui {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  max-height: calc(100% - 150px); overflow: auto;
}
.lil-gui {
  --background-color: rgba(8, 22, 28, 0.78);
  --widget-color: rgba(190, 228, 232, 0.12);
  --hover-color: rgba(190, 228, 232, 0.2);
  --focus-color: rgba(190, 228, 232, 0.28);
  --number-color: #f2b43c;
  --string-color: #9fe0d6;
  --title-background-color: rgba(4, 14, 18, 0.9);
  --font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-family-mono: "DM Mono", ui-monospace, monospace;
  --width: 290px;
  --name-width: 52%;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 4px;
}

#presets {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 150px);
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
}
#presets::-webkit-scrollbar { display: none; }
#presets button, #dive {
  flex: none; font: 600 13px/1 var(--font-ui); color: var(--ink);
  padding: 10px 14px; border-radius: 999px; cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: background 0.15s, color 0.15s;
}
#presets button:hover { background: rgba(20, 48, 56, 0.8); }
#presets button[aria-pressed="true"] { background: var(--pressed); color: #062028; border-color: transparent; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

#readout {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
}
#dive { background: var(--signal); color: #1a1204; border-color: transparent; min-width: 84px; }
#dive:hover { filter: brightness(1.08); }
#fps { font: 500 11px var(--font-data); color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; }

#hint {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  font: 400 11px var(--font-data); color: var(--ink-dim); pointer-events: none;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
[hidden] { display: none !important; }
body.harness #brand, body.harness #gui, body.harness #hint, body.harness #presets, body.harness #readout { display: none !important; }
#error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; line-height: 1.5; }

@media (max-width: 720px) {
  #presets { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #hint { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  #gui { top: calc(78px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 220px); }
  .lil-gui { --width: 260px; }
}
@media (prefers-reduced-motion: reduce) { #presets button { transition: none; } }

/* Phones and tablets (body.mobile: demo/mobile.js). Finger-sized targets, a compact panel
   (lil-gui, closed at first), nothing that needs a hover, no page zoom or text selection
   from a stray gesture, and the HUD clear of the notch and the home bar (safe-area insets above). */
body.mobile { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
body.mobile #presets { touch-action: pan-x; }
body.mobile #gui { touch-action: pan-y; overscroll-behavior: contain; }
body.mobile #presets button, body.mobile #dive { min-height: 44px; padding: 0 16px; font-size: 14px; touch-action: manipulation; }
body.mobile #fps { font-size: 12px; }
body.mobile #hint { font-size: 12px; transition: opacity 0.6s; }
#hint.faded { opacity: 0; }
body.mobile .lil-gui {
  --widget-height: 30px; --font-size: 13px; --input-font-size: 14px; --padding: 6px; --spacing: 7px;
  --width: min(300px, calc(100vw - 32px)); --name-width: 44%;
}
body.mobile .lil-gui .title { touch-action: manipulation; }
@media (max-width: 720px) {
  body.mobile #gui { max-height: calc(100% - 240px - env(safe-area-inset-bottom, 0px)); }
}
/* a phone held sideways: little height, so the brand shrinks and the panel shares the top */
@media (max-height: 500px) {
  body.mobile #brand { padding: 7px 11px 6px; }
  body.mobile #brand h1 { font-size: 15px; }
  body.mobile #brand p { display: none; }
  body.mobile #gui { top: calc(10px + env(safe-area-inset-top, 0px)); max-height: calc(100% - 84px - env(safe-area-inset-bottom, 0px)); }
  body.mobile #hint { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
}
/* wide enough for one bottom row: the presets scroll in the space left of the fps and Dive */
@media (min-width: 721px) {
  body.mobile #presets { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 170px); padding-right: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<header id="brand" class="chip">
  <h1>Open Water</h1>
  <p>FFT ocean · 3 cascades · MIT</p>
</header>
<div id="gui"></div>
<p id="hint">Drag to orbit · scroll or pinch to zoom · double-tap water to drop a crate</p>
<nav id="presets" aria-label="Environment presets"></nav>
<div id="readout">
  <span id="fps" aria-live="off">— fps</span>
  <button id="dive" type="button">Dive</button>
</div>
<div id="error" hidden></div>

<script>
// No WebGPU (e.g. Safari before 26): say so instead of showing the broken WebGL fallback.
if (!navigator.gpu && !/[?&]webgl/.test(location.search)) {
  document.addEventListener('DOMContentLoaded', () => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#06121c;color:#e8f1f6;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px';
    d.innerHTML = '<div style="max-width:420px"><div style="font-size:28px;font-weight:600;margin-bottom:8px">Open Water</div>This ocean runs on WebGPU, which this browser doesn\'t support yet.<br>Open it in <b>Chrome</b> or <b>Edge</b> (desktop or Android), or Safari 26+.</div>';
    document.body.appendChild(d);
  });
}
</script>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",

    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
  }
}
</script>
<script>
  // WebGPU, or WebGL 2 with float render targets for three.js's fallback backend.
  // ('three' maps to the WebGPU build so addons share its classes.)
  (function () {

    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2');
    if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
      var e = document.getElementById('error');
      e.hidden = false;
      e.textContent = 'This ocean needs WebGPU, or WebGL 2 with floating-point render targets. Try a recent Chrome, Edge, Firefox or Safari.';
      window.__unsupported = true;   // main.js stops at once
    }
  })();
  // The render harness (?shot) waits for window.__ready: an error before main.js gets that
  // far (a failed import, renderer.init throwing) ends the wait at once instead of after
  // the harness's timeout.
  if (/[?&]shot=/.test(location.search)) addEventListener('error', function (e) {
    if (window.__ready) return;
    window.__harnessError = 'page error: ' + (e.message || (e.error && e.error.message) || 'unknown');
    window.__ready = true;
  });
</script>
